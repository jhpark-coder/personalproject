spring.datasource.url=jdbc:h2:mem:fitmate-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.frontend.url=http://localhost:5173
app.backend.url=http://localhost:8080

jwt.secret=test-jwt-secret-key-for-fitmate-context-loads
jwt.expiration=86400000
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret

data.loader.enabled=false
scheduler.enabled=false
spring.data.redis.host=false
spring.data.redis.repositories.enabled=false
