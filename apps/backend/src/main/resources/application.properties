# 공통 설정
spring.application.name=fitmate
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# JPA 설정
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# 로깅 설정
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# 서버 설정
server.port=8080
server.servlet.context-path=/

# 개발 환경 특화 설정은 application-dev.properties에서만 활성화합니다.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# URL 설정
app.frontend.url=${APP_FRONTEND_URL:http://localhost}
app.backend.url=${APP_BACKEND_URL:http://localhost:8080}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost,http://localhost:5173,https://localhost:5173,http://127.0.0.1:5173,http://192.168.50.28:5173}

# 인증 쿠키 설정
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAMESITE:Lax}
app.auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}

# JWT 설정 - 환경변수에서 가져오기
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Redis 설정
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.repositories.enabled=false

# 이메일 설정 (Gmail 예시) - 문자 인증으로 대체하여 주석처리
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ===== DataLoader 설정 =====
# DataLoader 활성화 여부
data.loader.enabled=${DATA_LOADER_ENABLED:false}
# 테스트 데이터 생성 여부
data.loader.test-data.enabled=${DATA_LOADER_TEST_DATA_ENABLED:false}
data.loader.test-password=${DATA_LOADER_TEST_PASSWORD:}
data.loader.admin-password=${DATA_LOADER_ADMIN_PASSWORD:}
data.loader.demo-email=${DATA_LOADER_DEMO_EMAIL:demo@fitmate.local}

# ===== 스케줄러 설정 =====
# 스케줄러 활성화 여부
scheduler.enabled=${SCHEDULER_ENABLED:true}
# 운동 데이터 업데이트 스케줄 (매일 밤 2시)
scheduler.exercise.update.cron=0 0 2 * * ?
