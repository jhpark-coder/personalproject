spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

spring.data.redis.repositories.enabled=false

app.frontend.url=${APP_FRONTEND_URL:https://www.fitmate.com}
app.backend.url=${APP_BACKEND_URL:http://localhost:8080}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://www.fitmate.com}

app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie.same-site=${AUTH_COOKIE_SAMESITE:Lax}
app.auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

data.loader.enabled=${DATA_LOADER_ENABLED:false}
data.loader.test-data.enabled=${DATA_LOADER_TEST_DATA_ENABLED:false}
data.loader.test-password=${DATA_LOADER_TEST_PASSWORD:}
data.loader.admin-password=${DATA_LOADER_ADMIN_PASSWORD:}

scheduler.enabled=${SCHEDULER_ENABLED:true}
